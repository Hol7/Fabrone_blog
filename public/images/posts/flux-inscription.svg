<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-labelledby="t">
  <title id="t">Trajet d'une inscription : formulaire, Worker Cloudflare, API Brevo, boîte mail</title>
  <style>
    :root { --bg: #e3eae8; --ink: #14242b; --mute: #566a70; --line: #17695d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15222a; --ink: #e3ece9; --mute: #93a6a8; --line: #7ccbbb; } }
    .bg { fill: var(--bg); }
    .box { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; marker-end: url(#head); }
    .head { fill: none; stroke: var(--line); stroke-width: 1.5; }
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: var(--ink); }
    .name { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--mute); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M1 1 7 4 1 7"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="150" rx="8"/>
  <rect class="box" x="24" y="43" width="132" height="64" rx="6"/>
  <rect class="box" x="204" y="43" width="132" height="64" rx="6"/>
  <rect class="box" x="384" y="43" width="132" height="64" rx="6"/>
  <rect class="box" x="564" y="43" width="132" height="64" rx="6"/>
  <line class="arrow" x1="162" y1="75" x2="198" y2="75"/>
  <line class="arrow" x1="342" y1="75" x2="378" y2="75"/>
  <line class="arrow" x1="522" y1="75" x2="558" y2="75"/>
  <text class="name" x="90" y="72">Formulaire</text><text class="sub" x="90" y="92">sur le site</text>
  <text class="name" x="270" y="72">Worker</text><text class="sub" x="270" y="92">/api/subscribe</text>
  <text class="name" x="450" y="72">Brevo</text><text class="sub" x="450" y="92">liste de contacts</text>
  <text class="name" x="630" y="72">Boîte mail</text><text class="sub" x="630" y="92">confirmation</text>
</svg>
