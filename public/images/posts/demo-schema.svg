<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">Du brouillon à ton blog</title><desc id="desc">Écrire dans Keystatic, enregistrer un fichier, publier le blog.</desc><rect width="960" height="400" rx="16" fill="#1c1c1c"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="75" fill="#ddd" font-size="30">Une idée. Un article. Ton carnet.</text><g fill="#303030" stroke="#ff754a"><rect x="50" y="150" width="240" height="110" rx="10"/><rect x="360" y="150" width="240" height="110" rx="10"/><rect x="670" y="150" width="240" height="110" rx="10"/></g><g fill="#ddd" font-size="25"><text x="170" y="215">1. Écrire</text><text x="480" y="215">2. Enregistrer</text><text x="790" y="215">3. Publier</text></g><g fill="#ff754a" font-size="36"><text x="325" y="215">→</text><text x="635" y="215">→</text></g><text x="480" y="335" fill="#a2a2a8" font-size="20">Exemple de schéma SVG intégré dans un article</text></g></svg>
